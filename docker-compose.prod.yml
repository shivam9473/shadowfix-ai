services:
  # ── 1. ShadowFix AI Core Service ──
  shadowfix:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shadowfix-app
    restart: always
    environment:
      - SHADOWFIX_ENV=production
      - REDIS_URL=redis://shadowfix-redis:6379/0
      - QDRANT_MODE=disk
    env_file:
      - .env
    volumes:
      - shadowfix_data:/app/backend/data
    depends_on:
      - redis
    ports:
      - "8000:8000"
    networks:
      - shadowfix-net

  # ── 2. Redis Cache & Job Queue ──
  redis:
    image: redis:7-alpine
    container_name: shadowfix-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - shadowfix-net

  # ── 3. Qdrant Vector Database ──
  qdrant:
    image: qdrant/qdrant:latest
    container_name: shadowfix-qdrant
    restart: always
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    networks:
      - shadowfix-net

  # ── 4. Nginx Reverse Proxy & Load Balancer ──
  nginx:
    image: nginx:alpine
    container_name: shadowfix-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - shadowfix
    networks:
      - shadowfix-net

  # ── 5. Optional Extra: n8n Workflow Automation ──
  # To run with n8n: docker compose --profile extra -f docker-compose.prod.yml up -d
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: shadowfix-n8n
    restart: always
    profiles:
      - extra
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - shadowfix-net

volumes:
  shadowfix_data:
  redis_data:
  qdrant_data:
  certbot_certs:
  n8n_data:

networks:
  shadowfix-net:
    driver: bridge
