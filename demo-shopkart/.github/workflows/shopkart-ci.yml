name: Shopkart CI

on:
  push:
    paths:
      - "demo-shopkart/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -c "import ast, pathlib; ast.parse(pathlib.Path('demo-shopkart/api/checkout.py').read_text())"
